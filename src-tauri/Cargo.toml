[package]
name = "race-control-dashboard"
version = "1.0.0"
description = "Race Control Dashboard: strumenti per la direzione gara delle endurance a lobby"
edition = "2021"
rust-version = "1.77.2"

[lib]
# Il suffisso _lib evita conflitti di nome con il binario su Windows.
name = "race_control_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# image-png: il pallino delle notifiche sull'icona arriva dall'interfaccia come PNG.
tauri = { version = "2", features = ["image-png"] }
# Chiamate a Discord dal frontend senza blocchi CORS (solo verso discord.com/api, vedi capabilities).
tauri-plugin-http = "2"
# Apertura del browser di sistema per il login.
tauri-plugin-opener = "2"
# Aggiornamento automatico all'avvio (release firmate su GitHub) e riavvio dopo l'installazione.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# La configurazione dei plugin (plugins.updater in tauri.conf.json) viene incorporata come JSON.
serde_json = "1"
# Archivio sicuro del sistema operativo per il token di rinnovo.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

# Build di release più piccole: l'app non ha logica Rust pesante.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
