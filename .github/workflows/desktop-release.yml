# Crea l'installer per Windows, lo firma per l'aggiornamento automatico e pubblica la release su GitHub.
# Si avvia pubblicando un tag di versione uguale a quella di package.json (es. git tag v1.1.0 && git push --tags)
# o a mano da GitHub → Actions. La release è pubblica (non in bozza): con lei esce latest.json, il file che le app
# installate leggono all'avvio per sapere se c'è una versione nuova (vedi plugins.updater in src-tauri/tauri.conf.json).
#
# Segreti da impostare una volta (GitHub → Settings → Secrets and variables → Actions):
#   Secrets:   TAURI_SIGNING_PRIVATE_KEY (contenuto del file della chiave privata creata con `npx tauri signer generate`)
#              TAURI_SIGNING_PRIVATE_KEY_PASSWORD (la password scelta per la chiave)
#   Variables: VITE_CREW_API_URL (indirizzo del server su Cloudflare)
name: Installer desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Dipendenze npm
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Indirizzo del server su Cloudflare (in GitHub: Settings → Secrets and variables → Actions → Variables).
          VITE_CREW_API_URL: ${{ vars.VITE_CREW_API_URL }}
          # Firma degli aggiornamenti: le app installate accettano solo aggiornamenti firmati con questa chiave.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: 'Race Control Dashboard v__VERSION__'
          releaseBody: 'Scarica l’installer per Windows qui sotto. Chi ha già l’app la riceve in automatico al prossimo avvio.'
          releaseDraft: false
          prerelease: false
          # latest.json con versione, firma e indirizzo dell'installer, per l'aggiornamento automatico.
          includeUpdaterJson: true
          # Solo in questa build: installer NSIS (.exe) e file firmati per l'aggiornamento (in locale non serve la chiave).
          args: --config src-tauri/tauri.release.conf.json
