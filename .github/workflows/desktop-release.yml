# Crea gli installer per Windows, macOS e Linux e li allega a una release in bozza.
# Si avvia pubblicando un tag (es. git tag v1.0.0 && git push --tags) o a mano da GitHub → Actions.
name: Installer desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-installers:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            tauri-arguments: ''
          - platform: macos-latest
            tauri-arguments: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            tauri-arguments: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS: binario universale per Mac Intel e Apple Silicon.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Dipendenze di sistema (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - name: Dipendenze npm
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Indirizzo del server su Cloudflare (in GitHub: Settings → Secrets and variables → Actions → Variables).
          VITE_CREW_API_URL: ${{ vars.VITE_CREW_API_URL }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: 'Race Control Dashboard v__VERSION__'
          releaseBody: 'Scarica l’installer per il tuo sistema operativo qui sotto.'
          releaseDraft: true
          args: ${{ matrix.tauri-arguments }}
